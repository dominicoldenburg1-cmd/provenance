<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one-screen app. Header, scrolling view, bottom tabs. Figures are collected as perforated stamps with engraved rosettes; the map is a survey chart. */
  --bg:#e7ecef; --card:#f8f9f7; --ink:#101a2e; --muted:#59657a; --line:#c3ccd5;
  --water:#d9e4ea; --land:#f3f5f2;
  --sea:#25586b; --moss:#3e6a4e; --seal:#9b1c1c;
  --display:'Bodoni Moda','Didot',Georgia,serif;
  --body:'Public Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1424; --card:#15213a; --ink:#e9edf4; --muted:#93a0b8; --line:#2a3856;
    --water:#09101d; --land:#17233e;
    --sea:#74b4c8; --moss:#86c19a; --seal:#e8786a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1424; --card:#15213a; --ink:#e9edf4; --muted:#93a0b8; --line:#2a3856;
  --water:#09101d; --land:#17233e;
  --sea:#74b4c8; --moss:#86c19a; --seal:#e8786a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#app{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column}
header{padding:max(14px,env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand{font:italic 700 28px/1 var(--display);letter-spacing:-.01em;margin:0}
.loc{font:400 11px/1.3 var(--mono);color:var(--muted);margin-top:5px}
.count{font:500 12px var(--mono);color:var(--muted);text-align:right;white-space:nowrap}
.count b{font-size:18px;color:var(--ink);font-weight:500}
main{flex:1;overflow-y:auto;padding:0 16px 24px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:13px 4px 11px;font:500 13px var(--body);color:var(--muted);cursor:pointer;border-top:2px solid transparent;margin-top:-1px}
nav button[aria-current="page"]{color:var(--ink);border-top-color:var(--seal)}
h2{font:600 22px/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
h3{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.eyebrow{font:500 11px var(--mono);letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin-bottom:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;font:500 12px var(--mono);padding:6px 11px;border:1px solid var(--line);background:var(--card);border-radius:99px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.mapwrap{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:12px;position:relative;z-index:0;isolation:isolate}
#lmap{height:min(58vh,440px);width:100%;background:var(--water)}
.leaflet-container{font-family:var(--body)}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 2px}
.linkrow a{font:500 12px var(--mono);padding:7px 11px;border:1px solid var(--line);border-radius:99px;color:var(--ink);text-decoration:none;background:var(--card)}
.btn{display:block;width:100%;font:600 14px var(--body);padding:12px 14px;border-radius:6px;border:1px solid var(--ink);background:var(--ink);color:var(--card);cursor:pointer;margin-top:8px}
.btn.alt{background:transparent;color:var(--ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
button:focus-visible,.stamp:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.near{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 0;background:none;border:0;border-top:1px solid var(--line);cursor:pointer}
.near:first-of-type{border-top:0}
.near span:last-child{font:400 12px var(--mono);color:var(--muted);white-space:nowrap}
.hint{font-style:italic;color:var(--muted)}
.note{border-left:3px solid var(--seal);padding:4px 0 4px 10px;margin:10px 0;color:var(--muted);font-size:13px}
.row{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.tier{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:2px 0 10px}
.bar i{display:block;height:100%;background:var(--seal)}
.setrow{display:flex;justify-content:space-between;align-items:baseline}
.setrow span:last-child{font:400 12px var(--mono);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stamp{position:relative;background:var(--card);border:5px dotted var(--bg);padding:8px 4px 8px;text-align:center;cursor:pointer;min-width:0;border-radius:2px;box-shadow:0 0 0 1px var(--line)}
.stamp.locked{opacity:.65}
.stamp svg{display:block;margin:0 auto 4px}
.sn{font:600 12px/1.2 var(--display);min-height:2.4em;display:flex;align-items:center;justify-content:center}
.sy{font:400 10px var(--mono);color:var(--muted);margin-top:2px}
.copies{position:absolute;top:2px;right:4px;font:500 11px var(--mono);color:var(--seal)}
.sheet{position:fixed;inset:0;background:rgba(6,12,24,.6);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--card);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.opt{display:block;width:100%;text-align:left;padding:12px;margin-top:8px;border:1px solid var(--line);background:var(--bg);border-radius:6px;cursor:pointer;font-weight:500}
.opt.bad{border-color:var(--seal);color:var(--seal)}
.chipsm{display:inline-block;font:500 12px var(--mono);border:1px solid var(--line);border-radius:99px;padding:3px 10px;margin:0 6px 6px 0}
.swap{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0;font-size:13px}
.swap div{border:1px dashed var(--line);border-radius:4px;padding:8px}
.swap b{display:block;font:600 14px var(--display)}
.stampbig{display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 10px}
.stampbig .stamp{width:150px;cursor:default}
.postmark{font:500 11px/1.3 var(--mono);color:var(--seal);border:2px solid var(--seal);border-radius:4px;padding:5px 9px;text-align:center;letter-spacing:.04em;transform:rotate(-3deg)}
.pulse{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion: no-preference){
  .pulse{animation:pulse 1.8s ease-out infinite}
  .thunk{animation:thunk .5s cubic-bezier(.2,.9,.3,1.2) both}
}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(2.8);opacity:0}}
@keyframes thunk{0%{transform:scale(1.6) rotate(-9deg);opacity:0}100%{transform:scale(1) rotate(-3deg);opacity:1}}
</style>

<script>
/* ---------- Data ---------- */
const TIER={common:{label:'Common',c:'var(--sea)'},uncommon:{label:'Uncommon',c:'var(--moss)'},rare:{label:'Rare',c:'var(--seal)'}};
const SETS={founding:'Founding Era',presidents:'Presidents',civilwar:'Civil War',freedom:'Freedom & Civil Rights',women:'Women Who Shaped America',frontier:'Frontier & Exploration',native:'Native Nations',makers:'Makers & Pioneers',letters:'Arts & Letters',sports:'Sports'};

const FIGS=[
{id:'washington',name:'George Washington',years:'1732–1799',role:'Commander of the Continental Army, first President',tier:'common',sets:['founding','presidents'],
 bio:`Commanded the Continental Army through the American Revolution, then presided over the 1787 Constitutional Convention. Elected the first president in 1789, he stepped down after two terms.`,
 q:`Which 1787 gathering did Washington preside over?`,o:['The Constitutional Convention','The First Continental Congress','The Treaty of Paris talks'],
 deep:`His army wintered at Valley Forge in 1777–78, where Baron von Steuben drilled the troops into a sharper force. In 1797 he left office voluntarily, setting a precedent that held for over a century.`},
{id:'franklin',name:'Benjamin Franklin',years:'1706–1790',role:'Printer, scientist and diplomat',tier:'common',sets:['founding','makers'],
 bio:`Printer, scientist, writer and diplomat who rose from a Boston candlemaker's family to help found a nation. He negotiated the French alliance that helped win the Revolution.`,
 q:`Franklin signed the Declaration of Independence and which other founding document?`,o:['The U.S. Constitution','The Emancipation Proclamation','The Monroe Doctrine'],
 deep:`In 1731 he helped found the Library Company of Philadelphia, one of America's first subscription libraries. He is also the only founder to sign the Declaration, the Treaty of Paris and the Constitution.`},
{id:'jefferson',name:'Thomas Jefferson',years:'1743–1826',role:'Third President, author of the Declaration',tier:'common',sets:['founding','presidents'],
 bio:`Principal author of the Declaration of Independence and the third president. He roughly doubled the size of the country with the Louisiana Purchase in 1803.`,
 q:`What did the 1803 Louisiana Purchase do?`,o:['Roughly doubled U.S. territory','Ended the War of 1812','Created the Bill of Rights'],
 deep:`He founded the University of Virginia in 1819. His chosen epitaph lists the Declaration, the Virginia Statute for Religious Freedom and the university, and leaves out the presidency.`},
{id:'revere',name:'Paul Revere',years:'1735–1818',role:'Silversmith and patriot messenger',tier:'uncommon',sets:['founding'],
 bio:`A Boston silversmith and engraver who joined the patriot cause. On the night of April 18, 1775, he rode to warn that British troops were moving toward Lexington and Concord. Lanterns in the Old North Church steeple signaled which route they would take.`,
 q:`Two lanterns in the Old North Church steeple signaled that the British were coming by what route?`,o:['By sea','By land','They were not coming'],
 deep:`He was one of several riders that night, and a British patrol detained him near Lexington before he reached Concord. His engraving of the Boston Massacre was widely circulated.`},
{id:'lincoln',name:'Abraham Lincoln',years:'1809–1865',role:'16th President of the United States',tier:'common',sets:['presidents','civilwar','freedom'],
 bio:`Born in a Kentucky log cabin, Lincoln taught himself law and rose to lead the Union through the Civil War. He issued the Emancipation Proclamation in 1863 and pressed for the Thirteenth Amendment.`,
 q:`Lincoln's 1863 speech at Gettysburg dedicated what?`,o:['A national cemetery for Union soldiers','A new railroad line','The state capitol'],
 deep:`Edward Everett spoke for about two hours before Lincoln rose, and the president's remarks ran only a few minutes. Everett wrote to him the next day that Lincoln had reached the heart of the occasion in far fewer words.`},
{id:'chamberlain',name:'Joshua Chamberlain',years:'1828–1914',role:'Union officer, Medal of Honor recipient',tier:'rare',sets:['civilwar'],
 bio:`A college professor of rhetoric who volunteered for the Union Army. On July 2, 1863, his 20th Maine held the far left of the Union line on Little Round Top, and he later received the Medal of Honor.`,
 q:`Which regiment did Chamberlain command at Little Round Top?`,o:['20th Maine','54th Massachusetts','1st Minnesota'],
 deep:`Before the war he taught at Bowdoin College. After it he served four terms as governor of Maine and later became president of Bowdoin.`},
{id:'tubman',name:'Harriet Tubman',years:'c. 1822–1913',role:'Abolitionist and Underground Railroad conductor',tier:'rare',sets:['civilwar','freedom','women'],
 bio:`Born into slavery in Maryland, she escaped in 1849 and returned repeatedly to guide others to freedom. During the Civil War she served the Union Army as a scout, nurse and spy.`,
 q:`Tubman guided people to freedom along which network?`,o:['The Underground Railroad','The Pony Express','The Oregon Trail'],
 deep:`In 1863 she helped lead the Combahee River Raid in South Carolina, which freed more than 700 people. Later she settled in Auburn, New York, and opened her home to the elderly.`},
{id:'douglass',name:'Frederick Douglass',years:'1818–1895',role:'Abolitionist, writer and orator',tier:'rare',sets:['civilwar','freedom','letters'],
 bio:`Escaped slavery in 1838 and became one of the most powerful orators and writers of his century. His 1845 autobiography made him famous and a leading voice for abolition.`,
 q:`Which 1845 book did Douglass publish?`,o:['Narrative of the Life of Frederick Douglass','Uncle Tom\'s Cabin','Walden'],
 deep:`He spoke in favor of women's suffrage at Seneca Falls in 1848. Later he served as U.S. Marshal for the District of Columbia and as minister to Haiti.`},
{id:'stanton',name:'Elizabeth Cady Stanton',years:'1815–1902',role:'Women\'s rights leader',tier:'uncommon',sets:['women','freedom'],
 bio:`Organizer of the 1848 Seneca Falls Convention, the first women's rights convention in the United States. She drafted its Declaration of Sentiments and campaigned for decades alongside Susan B. Anthony.`,
 q:`Her 1848 declaration was modeled on which document?`,o:['The Declaration of Independence','The Magna Carta','The Federalist Papers'],
 deep:`Her call for women's right to vote was the most contested resolution at the convention. It passed narrowly, helped by Frederick Douglass speaking in its favor.`},
{id:'addams',name:'Jane Addams',years:'1860–1935',role:'Social reformer, Nobel Peace Prize laureate',tier:'rare',sets:['women'],
 bio:`Co-founded Hull House in Chicago in 1889, a settlement house that gave immigrant neighbors classes, childcare and a place to gather. In 1931 she became the first American woman to win the Nobel Peace Prize.`,
 q:`Which prize did Addams win in 1931?`,o:['The Nobel Peace Prize','The Pulitzer Prize','The Presidential Medal of Freedom'],
 deep:`She founded Hull House with Ellen Gates Starr. Its residents documented neighborhood conditions and pushed for labor, housing and child-welfare reforms.`},
{id:'parks',name:'Rosa Parks',years:'1913–2005',role:'Civil rights activist',tier:'rare',sets:['freedom','women'],
 bio:`On December 1, 1955, Parks declined to give up her bus seat in Montgomery, Alabama, and was arrested. Her arrest helped spark a boycott, supported by a young Martin Luther King Jr., that lasted 381 days.`,
 q:`How long did the Montgomery Bus Boycott last?`,o:['381 days','38 days','About three years'],
 deep:`She was already secretary of the Montgomery NAACP chapter and had trained in nonviolent protest. Congress awarded her its Gold Medal in 1999.`},
{id:'lazarus',name:'Emma Lazarus',years:'1849–1887',role:'Poet',tier:'rare',sets:['women','letters'],
 bio:`A New York poet who wrote "The New Colossus" in 1883 to help raise money for the Statue of Liberty's pedestal. Her poem was later cast on a plaque inside the pedestal.`,
 q:`What kind of work is "The New Colossus"?`,o:['A sonnet','A novel','A speech'],
 deep:`She died in 1887, years before her poem was mounted on the pedestal in 1903. She had also written about the persecution of Jews in Europe and aided refugees arriving in New York.`},
{id:'crockett',name:'Davy Crockett',years:'1786–1836',role:'Frontiersman and congressman',tier:'uncommon',sets:['frontier'],
 bio:`A frontiersman, soldier and Tennessee congressman whose tall tales made him famous in his own lifetime. He joined the Texian defenders and died at the Alamo in March 1836.`,
 q:`Crockett served in the U.S. Congress from which state?`,o:['Tennessee','Kentucky','Virginia'],
 deep:`He served three terms in the U.S. House of Representatives. Almanacs and stage plays spread his legend while he was still alive.`},
{id:'houston',name:'Sam Houston',years:'1793–1863',role:'General, president of the Republic of Texas',tier:'uncommon',sets:['frontier'],
 bio:`Commanded the Texian army that won the Battle of San Jacinto on April 21, 1836, securing Texas independence from Mexico. He served as president of the Republic of Texas and later as a U.S. senator and governor.`,
 q:`At which battle did Houston's army win Texas independence?`,o:['San Jacinto','The Alamo','Palo Alto'],
 deep:`The fighting at San Jacinto lasted roughly eighteen minutes. He is the only person elected governor of both Tennessee and Texas.`},
{id:'twain',name:'Mark Twain',years:'1835–1910',role:'Author and humorist',tier:'uncommon',sets:['letters'],
 bio:`Samuel Clemens grew up in Hannibal, Missouri, then worked as a Mississippi riverboat pilot before becoming America's best-known humorist. His books include The Adventures of Tom Sawyer and Adventures of Huckleberry Finn.`,
 q:`"Mark twain" was a riverboat call meaning what?`,o:['Two fathoms deep','Storm ahead','Dock in sight'],
 deep:`Hannibal became the model for St. Petersburg, the town in Tom Sawyer. Riverboat crews called out depth soundings, and "mark twain" marked safe water of two fathoms.`},
{id:'edison',name:'Thomas Edison',years:'1847–1931',role:'Inventor',tier:'common',sets:['makers'],
 bio:`Inventor who built a research laboratory at Menlo Park, New Jersey, in the 1870s. His team developed a practical incandescent light bulb in 1879 and an electrical system to power it.`,
 q:`Edison's Menlo Park team perfected a practical version of what in 1879?`,o:['The incandescent light bulb','The telephone','The steam locomotive'],
 deep:`He held 1,093 U.S. patents. His Menlo Park lab is often described as an early industrial research laboratory, where teams worked on many projects at once.`},
{id:'wrights',name:'Orville & Wilbur Wright',years:'1867–1912 · 1871–1948',role:'Aviation pioneers',tier:'uncommon',sets:['makers'],
 bio:`Bicycle makers from Dayton, Ohio, who built and flew the first powered, controlled airplane. On December 17, 1903, near Kitty Hawk, North Carolina, Orville flew for 12 seconds.`,
 q:`In which year did the Wright brothers make their first powered flights?`,o:['1903','1893','1913'],
 deep:`That first flight covered about 120 feet. They made four flights that morning, and the longest, by Wilbur, lasted 59 seconds.`},
{id:'armstrong',name:'Neil Armstrong',years:'1930–2012',role:'Astronaut, first person on the Moon',tier:'uncommon',sets:['makers'],
 bio:`A naval aviator and test pilot who commanded Apollo 11. On July 20, 1969, he became the first person to walk on the Moon.`,
 q:`Which mission carried Armstrong to the Moon?`,o:['Apollo 11','Gemini 8','Apollo 13'],
 deep:`In 1966 he commanded Gemini 8, which performed the first docking of two spacecraft in orbit. Apollo 11 lifted off from Kennedy Space Center on July 16, 1969.`},
{id:'mlk',name:'Martin Luther King Jr.',years:'1929–1968',role:'Baptist minister and civil rights leader',tier:'common',sets:['freedom'],
 bio:`A Baptist minister who became the leading voice of the American civil rights movement and championed nonviolent protest. He helped lead the Montgomery Bus Boycott and delivered the "I Have a Dream" speech at the 1963 March on Washington.`,
 q:`King delivered his "I Have a Dream" speech at which 1963 event?`,o:['The March on Washington','The Selma to Montgomery March','The Poor People\'s Campaign'],
 deep:`He won the Nobel Peace Prize in 1964 at age 35, the youngest recipient to that point. He became pastor of Dexter Avenue Baptist Church in Montgomery in 1954.`},
{id:'anthony',name:'Susan B. Anthony',years:'1820–1906',role:'Suffrage leader',tier:'uncommon',sets:['women','freedom'],
 bio:`Organizer who campaigned for more than fifty years for women's right to vote, working closely with Elizabeth Cady Stanton. She was arrested in 1872 for casting a ballot in Rochester, New York.`,
 q:`Why was Anthony arrested in 1872?`,o:['She voted in a presidential election','She published a banned newspaper','She spoke without a permit'],
 deep:`She and Stanton founded the National Woman Suffrage Association in 1869. The Nineteenth Amendment, ratified in 1920, was nicknamed the "Susan B. Anthony Amendment."`},
{id:'barton',name:'Clara Barton',years:'1821–1912',role:'Nurse and founder of the American Red Cross',tier:'rare',sets:['women','civilwar'],
 bio:`A nurse who delivered supplies and care to soldiers on Civil War battlefields and became known as the "Angel of the Battlefield." She founded the American Red Cross in 1881.`,
 q:`Which organization did Barton found in 1881?`,o:['The American Red Cross','The Salvation Army','The Girl Scouts'],
 deep:`She led the Red Cross for 23 years. After the war she also ran an office that searched for missing soldiers and helped families learn their fates.`},
{id:'grant',name:'Ulysses S. Grant',years:'1822–1885',role:'Union general and 18th President',tier:'common',sets:['presidents','civilwar'],
 bio:`Union general who led the Union armies to victory in the Civil War, then served as the 18th president from 1869 to 1877.`,
 q:`Which Confederate general surrendered to Grant in April 1865?`,o:['Robert E. Lee','Stonewall Jackson','Jefferson Davis'],
 deep:`His capture of Vicksburg on July 4, 1863, split the Confederacy in two. As president he backed the Fifteenth Amendment, ratified in 1870, which barred denying the vote on the basis of race.`},
{id:'troosevelt',name:'Theodore Roosevelt',years:'1858–1919',role:'26th President and conservationist',tier:'common',sets:['presidents'],
 bio:`The 26th president, who protected about 230 million acres of public land. He took office in 1901 and won the Nobel Peace Prize in 1906 for mediating the end of the Russo-Japanese War.`,
 q:`Which huge construction project did Roosevelt's administration push forward?`,o:['The Panama Canal','The Erie Canal','The Suez Canal'],
 deep:`He led the Rough Riders in Cuba in 1898. In 1906 he became the first sitting president to travel abroad, visiting Panama to see the canal work.`},
{id:'froosevelt',name:'Franklin D. Roosevelt',years:'1882–1945',role:'32nd President',tier:'common',sets:['presidents'],
 bio:`The 32nd president, elected four times, who led the nation through the Great Depression and most of World War II. His New Deal created programs such as Social Security.`,
 q:`The New Deal was a response to which crisis?`,o:['The Great Depression','The Spanish-American War','The Panic of 1837'],
 deep:`He used radio "fireside chats" to speak directly to Americans. He remains the only president elected to four terms.`},
{id:'jfk',name:'John F. Kennedy',years:'1917–1963',role:'35th President',tier:'common',sets:['presidents','makers'],
 bio:`The 35th president and the youngest person elected to the office. He led during the Cuban Missile Crisis and committed the nation to landing a person on the Moon.`,
 q:`In 1962, Kennedy set which goal for the decade?`,o:['Landing a person on the Moon','Ending the Cold War','Building the interstate highways'],
 deep:`In World War II he commanded the Navy patrol boat PT-109. His book Profiles in Courage won the Pulitzer Prize in 1957.`},
{id:'carver',name:'George Washington Carver',years:'c. 1864–1943',role:'Agricultural scientist and teacher',tier:'rare',sets:['makers','freedom'],
 bio:`Born into slavery in Missouri, he became a leading agricultural scientist and teacher. At Tuskegee Institute he taught farmers crop rotation and uses for peanuts and sweet potatoes.`,
 q:`Carver urged farmers to move beyond which soil-depleting crop?`,o:['Cotton','Wheat','Corn'],
 deep:`He taught at Tuskegee from 1896 until his death in 1943. His bulletins gave Southern farmers low-cost ways to restore worn-out soil.`},
{id:'earhart',name:'Amelia Earhart',years:'1897–1937',role:'Aviator',tier:'uncommon',sets:['women','makers'],
 bio:`Aviator who became the first woman to fly solo nonstop across the Atlantic in 1932. She set many records and became a champion of women in aviation.`,
 q:`What did Earhart become the first woman to do in 1932?`,o:['Fly solo nonstop across the Atlantic','Fly around the world','Reach the South Pole'],
 deep:`She flew from Harbour Grace, Newfoundland, to a pasture in Northern Ireland in under 15 hours. She was also the first president of the Ninety-Nines, an organization of women pilots.`},
{id:'sacagawea',name:'Sacagawea',years:'c. 1788–c. 1812',role:'Interpreter and guide, Lewis and Clark expedition',tier:'rare',sets:['native','frontier','women'],
 bio:`A Lemhi Shoshone woman who joined the Lewis and Clark expedition in 1805 as an interpreter and guide, traveling with her infant son. Her presence helped show Native nations the party came in peace.`,
 q:`What role did Sacagawea play on the Lewis and Clark expedition?`,o:['Interpreter and guide','Ship pilot','Army surgeon'],
 deep:`Her brother Cameahwait was a chief of the Lemhi Shoshone, and his people supplied the horses the expedition needed to cross the Rockies. Historians still debate the date of her death.`},
{id:'lewisclark',name:'Lewis & Clark',years:'1774–1809 · 1770–1838',role:'Leaders of the Corps of Discovery',tier:'uncommon',sets:['frontier','makers'],
 bio:`Meriwether Lewis and William Clark led the Corps of Discovery from 1804 to 1806, mapping the Louisiana Purchase and a route to the Pacific.`,
 q:`Which president sent Lewis and Clark west?`,o:['Thomas Jefferson','George Washington','John Adams'],
 deep:`Lewis had served as Jefferson's private secretary. Clark was the younger brother of Revolutionary War hero George Rogers Clark.`},
{id:'sittingbull',name:'Sitting Bull',years:'c. 1831–1890',role:'Hunkpapa Lakota leader',tier:'rare',sets:['native','frontier'],
 bio:`A Hunkpapa Lakota leader and spiritual figure who resisted U.S. efforts to take Lakota lands on the Great Plains. In June 1876 he was a respected leader among the Lakota and Cheyenne camped along the Little Bighorn River.`,
 q:`Sitting Bull was a leader of which people?`,o:['The Hunkpapa Lakota','The Cherokee','The Navajo'],

function addCopy(id,site,via){const c=S.coll[id]||(S.coll[id]={count:0,deep:false,log:[]});c.count++;c.log.push({site,via,t:Date.now()});return c.count;}

/* ---------- Drawing helpers ---------- */
/* Cartoon portraits supplied by the owner. Add a file to portraits/ and one line here per figure. */
const IMG=Object.fromEntries(['jefferson','washington','franklin','revere','lincoln','chamberlain','tubman','douglass','stanton','addams','parks'].map(k=>[k,'portraits/'+k+'.jpg']));
function rosette(id,size,color,text){
  if(IMG[id]){const s=Math.round(size*1.12),locked=text==='?';return `<img src="${IMG[id]}" alt="" width="${s}" height="${s}" style="display:block;margin:0 auto 4px;width:${s}px;height:${s}px;object-fit:cover;border-radius:2px;border:1.5px solid ${color};${locked?'filter:grayscale(1) contrast(.85) brightness(.9);opacity:.55':''}">`;}
  const h=hash(id),n=14+h%10,ry=5+(h>>4)%9,rot=(h>>8)%30;let g='';
  for(let i=0;i<n;i++)g+=`<ellipse cx="50" cy="50" rx="30" ry="${ry}" transform="rotate(${rot+i*180/n} 50 50)"/>`;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" aria-hidden="true"><g fill="none" style="stroke:${color}" stroke-width=".55" opacity=".8">${g}</g><circle cx="50" cy="50" r="31" fill="none" style="stroke:${color}" stroke-width=".9"/><circle cx="50" cy="50" r="19" style="fill:var(--card);stroke:${color}" stroke-width=".9"/><text x="50" y="57" text-anchor="middle" font-size="19" font-weight="600" style="font-family:var(--display);fill:${color}">${text}</text></svg>`;
}
function stampHTML(f){
  const c=S.coll[f.id],got=c&&c.count>0,t=TIER[f.tier];
  return `<button class="stamp ${got?'':'locked'}" data-a="fig" data-id="${f.id}" aria-label="${got?f.name:'Unknown figure in '+statesFor(f.id)}">${rosette(f.id,64,got?t.c:'var(--muted)',got?initials(f.name):'?')}<div class="sn">${got?f.name:'Unknown'}</div><div class="sy">${got?(f.years.length>12?TIER[f.tier].label:f.years):statesFor(f.id)}</div>${got&&c.count>1?`<span class="copies">×${c.count}</span>`:''}</button>`;
}


/* ---------- Real map (Leaflet + OpenStreetMap) ---------- */
let LM=null,mapEl=null,mkLayer=null;
const HAVE_L=typeof L!=='undefined';
function cssv(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||'#888';}
function initLM(){
  if(LM||!HAVE_L)return;
  mapEl=document.createElement('div');mapEl.id='lmap';
  LM=L.map(mapEl,{zoomControl:true,worldCopyJump:false,minZoom:3,maxZoom:19});
  const street=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
  const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery &copy; Esri'});
  street.addTo(LM);
  L.control.layers({'Street':street,'Satellite':sat},null,{position:'topright'}).addTo(LM);
  mkLayer=L.layerGroup().addTo(LM);
  const r=REG[S.region]||REG.usa;
  LM.fitBounds([[r[2],r[0]],[r[3],r[1]]]);
}
function updateMarkers(){
  if(!LM)return;
  mkLayer.clearLayers();
  const seal=cssv('--seal'),ink=cssv('--ink'),card=cssv('--card'),sea=cssv('--sea');
  for(const site of SITES){
    const seen=!!S.visits[site.id],near=inRange(site),sel=site.id===ui.sel;
    if(sel)L.circle([site.lat,site.lon],{radius:RANGE*1609.34,color:ink,weight:1.5,dashArray:'5 5',fill:true,fillOpacity:.06,interactive:false}).addTo(mkLayer);
    const m=L.circleMarker([site.lat,site.lon],{radius:sel?11:near?10:8,weight:sel?3:2,color:near?seal:(seen?card:ink),fillColor:seen?seal:card,fillOpacity:1}).addTo(mkLayer);
    m.bindTooltip(site.name,{direction:'top',offset:[0,-6]});
    m.on('click',()=>act('sel',{dataset:{id:site.id}}));
  }
  L.circleMarker([S.pos.lat,S.pos.lon],{radius:7,weight:3,color:'#fff',fillColor:sea,fillOpacity:1,interactive:false}).addTo(mkLayer);
  L.circle([S.pos.lat,S.pos.lon],{radius:RANGE*1609.34,color:sea,weight:1,fillColor:sea,fillOpacity:.08,interactive:false}).addTo(mkLayer);
}
function attachMap(){
  if(!HAVE_L||S.tab!=='map')return;
  const slot=document.getElementById('mapslot');if(!slot)return;
  initLM();
  if(mapEl.parentNode!==slot)slot.appendChild(mapEl);
  LM.invalidateSize();
  updateMarkers();
}
const gmaps=s=>`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lon}`;
const gdir=s=>`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}`;

/* ---------- Map (SVG fallback) ---------- */
function mapHTML(){
  if(!vb)vb=vbFor(S.region);
  const cw=Math.min(window.innerWidth,560)-34,k=vb.w/cw;
  let s=`<svg id="map" viewBox="${vb.x} ${vb.y} ${vb.w} ${vb.h}" role="img" aria-label="Map of historic sites across the United States" style="width:100%;aspect-ratio:${AR};display:block">`;
  s+=`<rect x="-300" y="-300" width="1200" height="900" style="fill:var(--water)"/>`;
  const land='M'+OUTLINE.map(p=>px(p[0]).toFixed(1)+','+py(p[1]).toFixed(1)).join('L')+'Z';
  s+=`<path d="${land}" style="fill:var(--land);stroke:var(--line)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>`;
  for(let lo=-125;lo<=-65;lo+=5)s+=`<line x1="${px(lo)}" y1="-300" x2="${px(lo)}" y2="600" style="stroke:var(--line)" stroke-width=".5" stroke-dasharray="2 4" vector-effect="non-scaling-stroke" opacity=".7"/>`;
  for(let la=25;la<=50;la+=5)s+=`<line x1="-300" y1="${py(la)}" x2="900" y2="${py(la)}" style="stroke:var(--line)" stroke-width=".5" stroke-dasharray="2 4" vector-effect="non-scaling-stroke" opacity=".7"/>`;
  const r=6.5*k;
  const order=SITES.slice().sort((a,b)=>(a.id===ui.sel)-(b.id===ui.sel));
  for(const site of order){
    const x=px(site.lon),y=py(site.lat),seen=!!S.visits[site.id],near=inRange(site),sel=site.id===ui.sel;
    s+=`<g data-a="sel" data-id="${site.id}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${r*2.4}" fill="transparent"/>`;
    if(near)s+=`<circle class="pulse" cx="${x}" cy="${y}" r="${r}" fill="none" style="stroke:var(--seal)" stroke-width="${1.6*k}"/>`;
    if(sel)s+=`<circle cx="${x}" cy="${y}" r="${r*1.9}" fill="none" style="stroke:var(--ink)" stroke-width="${1.3*k}" stroke-dasharray="${3*k} ${2.5*k}"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${r}" style="fill:${seen?'var(--seal)':'var(--card)'};stroke:${seen?'var(--card)':'var(--ink)'}" stroke-width="${1.7*k}"/></g>`;
    if(sel){const right=x>vb.x+vb.w*0.6;s+=`<text x="${x+(right?-1:1)*r*2.4}" y="${y+4*k}" text-anchor="${right?'end':'start'}" font-size="${12*k}" font-weight="600" style="font-family:var(--body);fill:var(--ink);stroke:var(--card);paint-order:stroke" stroke-width="${3.2*k}" stroke-linejoin="round" pointer-events="none">${site.name}</text>`;}
  }
  const X=px(S.pos.lon),Y=py(S.pos.lat);
  s+=`<circle cx="${X}" cy="${Y}" r="${11*k}" style="fill:var(--sea)" opacity=".22"/><circle cx="${X}" cy="${Y}" r="${5*k}" style="fill:var(--sea);stroke:var(--card)" stroke-width="${2*k}"/>`;
  return s+'</svg>';
}
function tweenTo(to){
  const from=vb||vbFor('usa'),t0=performance.now(),D=reduce?0:450;
  function step(t){const p=D?Math.min(1,(t-t0)/D):1,e=1-Math.pow(1-p,3);
    vb={x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e,w:from.w+(to.w-from.w)*e,h:from.h+(to.h-from.h)*e};
    const svg=document.getElementById('map');if(svg)svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
    if(p<1)requestAnimationFrame(step);else{vb=to;render();}}
  requestAnimationFrame(step);
}
function goRegion(key){S.region=key;save();render();if(LM){const r=REG[key];LM.flyToBounds([[r[2],r[0]],[r[3],r[1]]],{duration:.8});}else tweenTo(vbFor(key));}

function siteCard(){
  if(!ui.sel){
    const near=SITES.slice().sort((a,b)=>dist(a)-dist(b)).slice(0,3);
    return `<div class="card"><h2>Where history is waiting</h2>
      <p class="muted">Every site is a place the figure actually was. Travel there, read the dossier, pass the quiz, and the figure is stamped into your album. Spare copies can deepen a record or be traded.</p>
      <h3 style="margin-top:12px">Closest to you</h3>
      ${near.map(s=>`<button class="near" data-a="sel" data-id="${s.id}"><span>${s.name}, ${s.st}</span><span>${fmtD(dist(s))} mi</span></button>`).join('')}
      </div>${gpsCard()}`;
  }
  const site=SITE[ui.sel],f=FIG[site.fig],d=dist(site),near=d<=RANGE,seen=!!S.visits[site.id],w=waitMs(site);
  let btn='';
  if(near){btn=w?`<button class="btn" disabled>Recorded. Returns in ${Math.ceil(w/3.6e6)}h</button>`:`<button class="btn seal" data-a="study" data-id="${site.id}">${site.memorial?'Record your visit':'Study and collect'}</button>`;}
  else if(S.pos.mode==='demo'){btn=`<button class="btn" data-a="travel" data-id="${site.id}">Travel here (demo)</button>`;}
  else btn=`<button class="btn" disabled>Get within ${RANGE} mi to collect</button>`;
  return `<div class="card"><div class="eyebrow">${site.st} · ${fmtD(d)} mi away${near?' · in range':''}</div>
    <h2>${site.name}</h2>
    <p>${seen?`Figure: <b>${f.name}</b> <span class="tier" style="color:${TIER[f.tier].c}">${TIER[f.tier].label}</span>`:`<span class="hint">${site.hint}</span>`}</p>
    ${seen?`<p class="muted" style="font-size:13px">Why here: ${PROOF[site.id]}</p>`:''}
    ${site.memorial?`<div class="note">This collection point sits outside the grounds of a place that calls for respect. Please do not enter the grounds to play. Visits are recorded quietly, with no celebration.</div>`:''}
    ${btn}<button class="btn alt" data-a="zoomsite" data-id="${site.id}">Zoom to the exact spot</button><div class="linkrow"><a href="${gmaps(site)}" target="_blank" rel="noopener">Open in Google Maps</a><a href="${gdir(site)}" target="_blank" rel="noopener">Directions</a></div><button class="btn alt" data-a="clearsel">Back to the list</button></div>`;
}
function gpsCard(){
  return `<div class="card"><div class="eyebrow">LOCATION</div>
    <p style="margin-bottom:4px">${S.pos.mode==='demo'?'Demo travel is on. Tapping a site lets you jump there.':'Live location is on. You must be within '+RANGE+' mi of a site.'}</p>
    ${ui.gpsMsg?`<p class="muted" style="font-size:13px">${ui.gpsMsg}</p>`:''}
    ${S.pos.mode==='demo'?`<button class="btn alt" data-a="gps">Use my GPS</button>`:`<button class="btn alt" data-a="demo">Switch to demo travel</button>`}</div>`;
}

/* ---------- Album ---------- */
function albumHTML(){
  const flt=ui.afilter||'all',got=f=>!!(S.coll[f.id]&&S.coll[f.id].count>0);
  const pool=flt==='all'?FIGS:FIGS.filter(f=>f.sets.includes(flt));
  const list=pool.slice().sort((a,b)=>got(b)-got(a));
  const n=pool.filter(got).length;
  const chips=[['all','All']].concat(Object.keys(SETS).map(k=>[k,SETS[k]]));
  return `<h3 style="margin-top:4px">Album</h3>
    <div class="chips" role="group" aria-label="Group">${chips.map(([k,l])=>`<button class="chip" data-a="afilter" data-id="${k}" aria-pressed="${flt===k}">${l}</button>`).join('')}</div>
    <div class="setrow"><b style="font:600 17px var(--display)">${flt==='all'?'Everyone':SETS[flt]}</b><span>${n}/${pool.length}${n===pool.length?' · complete':''}</span></div>
    <div class="bar"><i style="width:${pool.length?n/pool.length*100:0}%"></i></div>
    <div class="grid" style="margin-bottom:18px">${list.map(stampHTML).join('')}</div>`;

function figSheet(){
  const f=FIG[ui.fig],c=S.coll[f.id],got=c&&c.count>0,t=TIER[f.tier];
  if(!got){
    const hints=SITES.filter(s=>s.fig===f.id);

      <p>${hints.length>1?'This figure turns up in '+hints.length+' places.':'This figure is tied to one place.'} Look in ${statesFor(f.id)}.</p>

    <p class="muted" style="font-size:13px">${f.role}</p><p>${f.bio}</p>

    <h3>Provenance</h3>${c.log.map(e=>`<p style="margin-bottom:4px;font-size:13px">${fmtDate(e.t)} · ${e.site?SITE[e.site].name+', '+SITE[e.site].st:e.via}</p>`).join('')}
    <h3>Connected figures</h3><div>${mates.map(m=>{const g=S.coll[m.id]&&S.coll[m.id].count>0;return `<span class="chipsm" style="${g?'':'color:var(--muted)'}">${g?m.name:'Unknown'}</span>`;}).join('')}</div>

/* ---------- Trade ---------- */
function tradeHTML(){
  const sp=FIGS.filter(f=>spares(f.id)>0);
  let h=`<h3 style="margin-top:4px">Your spares</h3><div class="card">${sp.length?sp.map(f=>`<span class="chipsm">${f.name} ×${spares(f.id)}</span>`).join(''):`<p class="muted" style="margin:0">None yet. A second site tied to the same figure gives a spare, and so does a return visit a day later. Lincoln appears in three places.</p>`}</div>`;
  h+=`<h3>Collectors nearby</h3>`;
  for(const o of OFFERS){
    const g=FIG[o.give],done=S.trades.includes(o.id),elig=FIGS.filter(f=>f.sets.includes(o.want)&&spares(f.id)>0),open=ui.tradeOpen===o.id;
    h+=`<div class="card"><div class="eyebrow">${o.who.toUpperCase()} · ${o.where.toUpperCase()}</div><p>${o.line}</p>
      <div class="swap"><div><span class="muted">You get</span><b>${g.name}</b><span class="tier" style="color:${TIER[g.tier].c}">${TIER[g.tier].label}</span></div><span>for</span><div><span class="muted">You give</span><b>1 spare</b><span style="font-size:12px">${SETS[o.want]}</span></div></div>`;
    if(done)h+=`<button class="btn" disabled>Trade complete</button>`;
    else if(!elig.length)h+=`<button class="btn" disabled>Needs a spare from ${SETS[o.want]}</button>`;
    else if(!open)h+=`<button class="btn" data-a="topen" data-id="${o.id}">Trade</button>`;
    else h+=`<p class="muted" style="font-size:13px;margin:8px 0 0">Choose the spare to give:</p>${elig.map(f=>`<button class="opt" data-a="tdo" data-id="${o.id}" data-fig="${f.id}">${f.name} <span class="muted">(${spares(f.id)} spare)</span></button>`).join('')}`;
    h+=`</div>`;
  }
  const pool=FIGS.filter(f=>f.tier!=='rare'&&!(S.coll[f.id]&&S.coll[f.id].count>0));
  h+=`<h3>Archive exchange</h3><div class="card"><p>Hand in 3 spares and the archive sends one Common or Uncommon figure you do not own yet. Rare figures only come from travel or trades.</p><button class="btn" data-a="exchange" ${totalSpares()<3||!pool.length?'disabled':''}>${!pool.length?'Nothing left to receive':totalSpares()<3?`Needs 3 spares (you have ${totalSpares()})`:'Exchange 3 spares'}</button></div>`;
  h+=`<h3>Prototype</h3><div class="card"><p class="muted" style="font-size:13px">Collectors here are simulated. Real player-to-player trading needs accounts and a server.</p><button class="btn alt" data-a="reset">${ui.confirmReset?'Tap again to erase progress':'Reset progress'}</button></div>`;
  return h;
}

/* ---------- Study flow ---------- */
function sheet(inner){return `<div class="sheet" data-a="shade"><div role="dialog" aria-modal="true">${inner}</div></div>`;}

  if(st.step==='read'){
    return sheet(`<div class="eyebrow">FIELD DOSSIER · ${site.name.toUpperCase()}</div><div class="row">${rosette(f.id,84,t.c,initials(f.name))}<div><h2>${f.name}</h2><div class="muted" style="font-size:13px">${f.years}</div><span class="tier" style="color:${t.c}">${t.label}</span></div></div>
      <p class="muted" style="font-size:13px">${f.role}</p><p>${f.bio}</p>
      <div class="note" style="border-left-color:var(--sea)">Why here: ${PROOF[site.id]}</div>
      ${site.memorial?`<div class="note">You are near a place that calls for respect. Take a moment before you continue.</div>`:''}
      <button class="btn" data-a="quiz">I have read it. Take the quiz</button><button class="btn alt" data-a="close">Not now</button>`);

      ${st.wrong!==null?`<p style="margin:12px 0 0;color:var(--seal)">Not quite. Re-read the dossier and try again.</p><button class="btn" data-a="reread">Re-read the dossier</button>`:''}`);
  }

  return sheet(`<div class="eyebrow" style="text-align:center">${dup?'DUPLICATE':'NEW IN YOUR ALBUM'}</div>
    <div class="stampbig"><div class="stamp ${site.memorial?'':'thunk'}" style="width:150px;cursor:default">${rosette(f.id,110,t.c,initials(f.name))}<div class="sn" style="font-size:15px">${f.name}</div><div class="sy">${f.years.length>12?t.label:f.years}</div></div>
    <div class="postmark">${site.name.toUpperCase()}<br>${site.st} · ${d}</div></div>
    <p style="text-align:center">${dup?`You now hold ${st.count} copies, so ${st.count-1} spare. Spares can deepen a record or be traded.`:'Stamped and added. Open its record any time from the album.'}</p>
    <button class="btn" data-a="toalbum">View album</button><button class="btn alt" data-a="close">Keep exploring</button>`);

/* ---------- Shell ---------- */
function header(){return `<header><div><h1 class="brand">Provenance</h1><div class="loc">${S.pos.label} · ${S.pos.mode==='demo'?'demo travel':'live GPS'}</div></div><div class="count"><b>${owned().length}</b> / ${FIGS.length}<br>figures</div></header>`;}

function render(keep=true){

const app=document.getElementById('app');

/* ---------- Actions ---------- */
function gps(){
  if(!navigator.geolocation){ui.gpsMsg='Location is not available on this device. Demo travel stays on.';render();return;}
  ui.gpsMsg='Asking for your location...';render();
  try{navigator.geolocation.getCurrentPosition(
    p=>{S.pos={lat:p.coords.latitude,lon:p.coords.longitude,label:'Your location',mode:'gps'};ui.gpsMsg='';save();render();},
    ()=>{ui.gpsMsg='Location permission was denied or timed out, so demo travel stays on. Allow location for this site in your phone settings to use real GPS.';render();},
    {enableHighAccuracy:true,timeout:8000});
  }catch(e){ui.gpsMsg='Location could not be read, so demo travel stays on.';render();}
}
function act(a,el){
  switch(a){
    case 'tab':S.tab=el.dataset.id;ui.sel=null;save();render(false);break;
    case 'region':goRegion(el.dataset.id);break;
    case 'zoomsite':{const t=SITE[el.dataset.id];if(LM)LM.flyTo([t.lat,t.lon],18,{duration:.9});else{const w=5,h=w/AR;tweenTo({x:px(t.lon)-w/2,y:py(t.lat)-h/2,w,h});}break;}
    case 'afilter':ui.afilter=el.dataset.id;render();break;
    case 'sel':{ui.sel=el.dataset.id;render();const t=SITE[ui.sel];if(LM&&t)LM.flyTo([t.lat,t.lon],Math.max(LM.getZoom(),14),{duration:.7});break;}
    case 'clearsel':ui.sel=null;render();if(LM)updateMarkers();break;
    case 'travel':{const s=SITE[el.dataset.id];S.pos={lat:s.lat,lon:s.lon,label:s.name,mode:'demo'};save();render();break;}
    case 'gps':gps();break;
    case 'demo':S.pos.mode='demo';ui.gpsMsg='';save();render();break;
    case 'study':ui.study={site:el.dataset.id,step:'read',wrong:null,count:0};render(false);break;
    case 'quiz':ui.study.step='quiz';ui.study.wrong=null;render(false);break;
    case 'reread':ui.study.step='read';ui.study.wrong=null;render(false);break;
    case 'pick':{const i=+el.dataset.i;if(i===0){const site=SITE[ui.study.site];ui.study.count=addCopy(site.fig,site.id,'visit');S.visits[site.id]=Date.now();ui.study.step='done';save();}else ui.study.wrong=i;render(false);break;}
    case 'toalbum':ui.study=null;S.tab='album';save();render(false);break;
    case 'fig':ui.fig=el.dataset.id;render();break;
    case 'close':ui.study=null;ui.fig=null;render();break;
    case 'deepen':{const c=S.coll[el.dataset.id];if(c&&!c.deep&&c.count>1){c.count--;c.deep=true;save();}render();break;}
    case 'topen':ui.tradeOpen=ui.tradeOpen===el.dataset.id?null:el.dataset.id;render();break;
    case 'tdo':{const o=OFFERS.find(x=>x.id===el.dataset.id),fid=el.dataset.fig;if(o&&spares(fid)>0&&!S.trades.includes(o.id)){S.coll[fid].count--;addCopy(o.give,null,`Traded with ${o.who} in ${o.where}`);S.trades.push(o.id);ui.tradeOpen=null;save();}render();break;}
    case 'exchange':{const pool=FIGS.filter(f=>f.tier!=='rare'&&!(S.coll[f.id]&&S.coll[f.id].count>0));if(totalSpares()>=3&&pool.length){let need=3;while(need>0){const top=FIGS.slice().sort((a,b)=>spares(b.id)-spares(a.id))[0];S.coll[top.id].count--;need--;}const pick=pool[Math.floor(Math.random()*pool.length)];addCopy(pick.id,null,'Archive exchange');ui.fig=pick.id;save();}render();break;}
    case 'reset':if(ui.confirmReset){S=fresh();vb=null;ui.confirmReset=false;ui.sel=null;save();}else ui.confirmReset=true;render(S.tab==='trade');break;
  }
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.dataset.a==='shade'){if(e.target!==el)return;ui.study=null;ui.fig=null;render();return;}
  act(el.dataset.a,el);
});
window.addEventListener('resize',()=>render());

function boot(data){if(data&&data.coll)S=Object.assign(fresh(),data);
  for(const k of Object.keys(S.visits))if(!SITE[k])delete S.visits[k];
  for(const id of Object.keys(S.coll))S.coll[id].log=S.coll[id].log.map(e=>e.site&&!SITE[e.site]?{site:null,via:'Visit',t:e.t}:e);
  vb=vbFor(S.region);render(false);}
if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>S);
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(boot);else boot(window.claude&&window.claude.hot?window.claude.hot.data:null);
</script>
</body>
</html>
